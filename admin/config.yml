backend:
  name: git-gateway
  branch: main # تأكد أن سميت الفرع في GitHub هي main

media_folder: "img/uploads" # هنا غيتحطو التصاور اللي صغرتي بـ TinyJPG
public_folder: "/img/uploads"

collections:
  - name: "blog"
    label: "المقالات والتدوينات"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "عنوان المقال الرئيسي", name: "title", widget: "string"}
      - {label: "تاريخ النشر", name: "date", widget: "datetime"}
      
      # خانة الصورة اللي غتكون Banner ديال المقال
      - {label: "الصورة الرئيسية للمقال", name: "image", widget: "image"}
      
      # خانة الرابط السحري (يوتيوب، مطعم، لوحة، إلخ)
      - {label: "رابط خارجي (Video/Affiliate/Map)", name: "external_link", widget: "string", required: false, hint: "حط هنا رابط يوتيوب أو رابط مطعم أو أي رابط بغيتي توجه ليه الناس"}

      # صناديق المحتوى (6 لغات) بتنسيق Markdown لراحة العين
      - {label: "المقال بالعربية 🇲🇦", name: "body_ar", widget: "markdown"}
      - {label: "المقال بالإنجليزية 🇬🇧", name: "body_en", widget: "markdown"}
      - {label: "المقال بالفرنسية 🇫🇷", name: "body_fr", widget: "markdown"}
      - {label: "المقال بالهولندية 🇳🇱", name: "body_nl", widget: "markdown"}
      - {label: "المقال بالألمانية 🇩🇪", name: "body_de", widget: "markdown"}
      - {label: "المقال بالإسبانية 🇪🇸", name: "body_es", widget: "markdown"}
