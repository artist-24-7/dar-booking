<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">
    <style>
        .blog-header { background: #f0f7ff; padding: 60px 20px; text-align: center; border-bottom: 2px solid #0077be; }
        .post-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; padding: 40px; max-width: 1200px; margin: auto; }
        .post-card { border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: #fff; transition: 0.3s; }
        .post-card:hover { transform: translateY(-10px); }
        .post-card img { width: 100%; height: 200px; object-fit: cover; }
        .post-card-content { padding: 20px; }
        .btn-read { display: inline-block; padding: 10px 20px; background: #0077be; color: white; border-radius: 5px; text-decoration: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="blog-header">
        <h1>Ocean View Villa Blog</h1>
        <p>دليلك الشامل لاستكشاف سيدي موسى، الواليدية، وسحر دكالة</p>
    </div>

    <div class="post-grid">
        <div class="post-card">
            <img src="../img/ocean-view.jpg" alt="Sidi Moussa Lagoon">
            <div class="post-card-content">
                <span style="color: #0077be; font-size: 0.8rem; font-weight: bold;">NATURE & RELAX</span>
                <h3>سيدي موسى: الجوهرة المخفية والهدوء المطلق</h3>
                <p>اكتشف لماذا تعتبر سيدي موسى الوجهة الأمثل للهروب من ضجيج العالم ومراقبة النجوم...</p>
                <a href="post1.html" class="btn-read">اقرأ المزيد</a>
            </div>
        </div>
        
        </div>

    <footer style="text-align: center; padding: 20px;">
        <a href="../index.html" style="color: #0077be;">← العودة للموقع الرئيسي</a>
    </footer>

    <body>
    <div class="top-nav" style="display: flex; justify-content: space-between; padding: 20px;">
        <a href="../index.html" id="back-link">← العودة للموقع</a>
        <a href="../index.html#booking" class="btn-royal" id="book-btn">Book Your Stay ⛵</a>
    </div>
    
    <div class="lang-switcher">
         <button onclick="changeLang('ar', this)">Ar</button>
         <button onclick="changeLang('nl', this)">Nl</button>
         </div>

    <div id="ar" class="lang-content active-content">...</div>
    <div id="nl" class="lang-content">...</div>

        <script>
    function changeLang(lang, btn) {
        // هادي كتمسح 'active' من كاع النصوص وتخفيهم
        document.querySelectorAll('.lang-content').forEach(div => div.style.display = 'none');
        
        // هادي كتظهر غير اللغة اللي اختاريتي
        document.getElementById(lang).style.display = 'block';

        // ترجمة أزرار الرجوع والحجز
        const translations = {
            'ar': { back: '← العودة للموقع', book: 'احجز إقامتك الآن ⛵' },
            'nl': { back: '← Terug naar website', book: 'Boek je verblijf ⛵' },
            'en': { back: '← Back to Website', book: 'Book Your Stay ⛵' },
            'fr': { back: '← Retour au site', book: 'Réservez maintenant ⛵' },
            'de': { back: '← Zurück zur Website', book: 'Jetzt buchen ⛵' },
            'es': { back: '← Volver al sitio', book: 'Reserva ahora ⛵' }
        };

        document.getElementById('back-link').innerText = translations[lang].back;
        document.getElementById('book-btn').innerText = translations[lang].book;
    }
</script>
</body>
</html>
