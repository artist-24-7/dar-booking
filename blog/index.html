<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="blog-style.css"> 
    <title>Sidi Moussa Blog | السكينة</title>
</head>
<body>
    <header class="blog-header">
        <h1>Sidi Moussa Chronicles</h1>
        <p id="sub-header">🌊 رحلة للراحة النفسية وسط الطبيعة</p>
    </header>

    <div class="article-container" style="margin-top: 30px; text-align: center;">
        
        <div class="lang-box">
            <button class="lang-btn active-btn" onclick="changeLang('ar', this)">🇲🇦 AR</button>
            <button class="lang-btn" onclick="changeLang('nl', this)">🇳🇱 NL</button>
            <button class="lang-btn" onclick="changeLang('en', this)">🇬🇧 EN</button>
            <button class="lang-btn" onclick="changeLang('fr', this)">🇫🇷 FR</button>
            <button class="lang-btn" onclick="changeLang('de', this)">🇩🇪 DE</button>
            <button class="lang-btn" onclick="changeLang('es', this)">🇪🇸 ES</button>
        </div>

        <div id="content-area">
            <h2 id="main-title">مرحباً بك في عالم السكينة</h2>
            <p id="main-desc">اكتشف مقالاتنا حول الديجيتال ديتوكس، مراقبة النجوم، وحياة البحر.</p>
            
            <div style="margin-top: 30px;">
                <a href="post1.html" id="read-btn" class="btn-royal-main">اقرأ المقال الأول: سحر سيدي موسى ←</a>
            </div>
        </div>
    </div>

    <script>
        function changeLang(lang, btn) {
            // تبديل شكل الزر النشط
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');

            // قاموس الترجمة للواجهة
            const translations = {
                'ar': {
                    sub: '🌊 رحلة للراحة النفسية وسط الطبيعة',
                    title: 'مرحباً بك في عالم السكينة',
                    desc: 'اكتشف مقالاتنا حول الديجيتال ديتوكس، مراقبة النجوم، وحياة البحر.',
                    btn: 'اقرأ المقال الأول: سحر سيدي موسى ←'
                },
                'en': {
                    sub: '🌊 A journey to peace in nature',
                    title: 'Welcome to the World of Serenity',
                    desc: 'Discover our articles on digital detox, stargazing, and ocean life.',
                    btn: 'Read the first article: Sidi Moussa Magic ←'
                },
                'nl': {
                    sub: '🌊 Een reis naar rust in de natuur',
                    title: 'Welkom in de wereld van sereniteit',
                    desc: 'Ontdek onze artikelen over digitale detox, sterren kijken en het leven aan de oceaan.',
                    btn: 'Lees het eerste artikel: De magie van Sidi Moussa ←'
                },
                'fr': {
                    sub: '🌊 Un voyage vers la paix en pleine nature',
                    title: 'Bienvenue dans le monde de la sérénité',
                    desc: 'Découvrez nos articles sur la détox digitale, l\'observation des étoiles et la vie océanique.',
                    btn: 'Lire le premier article : La magie de Sidi Moussa ←'
                },
                'de': {
                    sub: '🌊 Eine Reise zur Ruhe in der Natur',
                    title: 'Willkommen in der Welt der Gelassenheit',
                    desc: 'Entdecken Sie unsere Artikel über digitalen Detox, Sterngucken und das Leben am Ozean.',
                    btn: 'Ersten Artikel lesen: Der Zauber von Sidi Moussa ←'
                },
                'es': {
                    sub: '🌊 Un viaje hacia la paz en la naturaleza',
                    title: 'Bienvenido al mundo de la serenidad',
                    desc: 'Descubre nuestros artículos sobre detox digital, observación de estrellas y vida oceánica.',
                    btn: 'Leer el primer artículo: La magia de Sidi Moussa ←'
                }
            };

            // تطبيق الترجمة على العناصر
            document.getElementById('sub-header').innerText = translations[lang].sub;
            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('main-desc').innerText = translations[lang].desc;
            document.getElementById('read-btn').innerText = translations[lang].btn;
        }
    </script>
</body>
</html>
